<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Results summary component</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="main-card">
      <div class="left-card">
        <h3>Your Result</h3>
        <div class="circle">
          <div class="circle-top-number">76</div>
          <div class="circle-bottom-number">of 100</div>
        </div>

        <h2>Great</h2>
        <p>
          You scored higher than 65% of the people who have taken these tests.
        </p>
      </div>
      <div class="right-card">
        <h3>Summary</h3>
        <div class="card-info reaction">
          <div class="icon pink">
            <img src="assets/images/icon-reaction.svg" alt="reaction icon" />
            <div>Reaction</div>
          </div>
          <div><span>80 </span>/ 100</div>
        </div>

        <div class="card-info memory">
          <div class="icon yellow">
            <img src="assets/images/icon-memory.svg" alt="memory icon" />
            <div>Memory</div>
          </div>
          <div><span>92 </span>/ 100</div>
        </div>

        <div class="card-info verbal">
          <div class="icon green">
            <img src="assets/images/icon-verbal.svg" alt="verbal icon" />
            <div>Verbal</div>
          </div>
          <div><span>61 </span>/ 100</div>
        </div>

        <div class="card-info visual">
          <div class="icon blue">
            <img src="assets/images/icon-visual.svg" alt="visual icon " />
            <div>Visual</div>
          </div>
          <div><span>72 </span>/ 100</div>
        </div>

        <a href="#" class="continue-btn">Continue</a>
      </div>
    </div>
    <!-- <footer class="attribution">

      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer> -->
  </body>
</html>
